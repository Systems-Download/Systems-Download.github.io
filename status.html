<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — Conch & Cmdr</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--conch:#0ff4c6;--cmdr:#ff4f5e;--bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;--border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;--ok:#3cc878;--warn:#ffc832;--err:#ff4f5e;}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(11,12,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px}
.nav-logo{font-size:1.1rem;font-weight:800;display:flex;gap:.4em;align-items:center;text-decoration:none}
.nav-logo .c{color:var(--conch)}.nav-logo .sep{color:var(--muted)}.nav-logo .r{color:var(--cmdr)}
.nav-right{display:flex;align-items:center;gap:1.5rem}
nav a.nl{color:var(--muted);text-decoration:none;font-size:.8rem;font-family:var(--mono);letter-spacing:.04em;transition:color .2s}
nav a.nl:hover{color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:7rem 2rem 4rem}
.hero{text-align:center;margin-bottom:3rem}
.overall-badge{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--mono);font-size:.78rem;padding:.5rem 1.2rem;border-radius:999px;margin-bottom:1.5rem;font-weight:600}
.ob-ok{background:rgba(60,200,120,.12);color:var(--ok);border:1px solid rgba(60,200,120,.25)}
.ob-warn{background:rgba(255,200,50,.12);color:var(--warn);border:1px solid rgba(255,200,50,.25)}
.ob-err{background:rgba(255,79,94,.12);color:var(--err);border:1px solid rgba(255,79,94,.25)}
.hero-title{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem}
.hero-sub{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.pulse{width:8px;height:8px;border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
.pulse-ok{background:var(--ok)}.pulse-warn{background:var(--warn)}.pulse-err{background:var(--err)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.section-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);opacity:.6;margin-bottom:.75rem;margin-top:2rem}
.service-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.2rem;margin-bottom:.5rem;display:flex;align-items:center;gap:1rem;transition:border-color .2s}
.service-card:hover{border-color:rgba(255,255,255,.12)}
.svc-icon{font-size:1.2rem;flex-shrink:0;width:36px;text-align:center}
.svc-info{flex:1}
.svc-name{font-size:.9rem;font-weight:700;margin-bottom:.15rem}
.svc-desc{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.svc-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.svc-ping{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.svc-status{display:flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.72rem;font-weight:600}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-err{color:var(--err)}.st-chk{color:var(--muted);opacity:.6}
.uptime-bar{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1.2rem;margin-top:2rem}
.uptime-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.6;margin-bottom:.75rem}
.uptime-dots{display:flex;gap:3px;flex-wrap:wrap}
.ud{width:8px;height:24px;border-radius:2px;background:var(--surface2);border:1px solid var(--border)}
.ud-ok{background:var(--ok);border-color:rgba(60,200,120,.4)}
.ud-warn{background:var(--warn);border-color:rgba(255,200,50,.4)}
.ud-err{background:var(--err);border-color:rgba(255,79,94,.4)}
.uptime-legend{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;font-family:var(--mono);font-size:.65rem;color:var(--muted)}
.last-check{text-align:center;font-family:var(--mono);font-size:.7rem;color:var(--muted);opacity:.5;margin-top:2rem}
.btn-refresh{font-family:var(--mono);font-size:.75rem;padding:.45rem 1rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.4rem}
.btn-refresh:hover{border-color:rgba(255,255,255,.18);color:var(--text)}
.btn-refresh.spin span{animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:2rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);margin-top:3rem;opacity:.4}
</style>
</head>
<body>

<script>
const SUPA_URL  = 'https://YOUR_PROJECT.supabase.co';
const SUPA_ANON = 'YOUR_ANON_KEY';
const GITHUB_REPO = 'Systems-Download/Systems-Download.github.io';
</script>

<nav>
  <a class="nav-logo" href="index.html"><span class="c">Conch</span><span class="sep">/</span><span class="r">Cmdr</span></a>
  <div class="nav-right">
    <a class="nl" href="index.html">Downloads</a>
    <a class="nl" href="announcements.html">Announcements</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="overall-badge ob-chk" id="overall-badge"><div class="pulse pulse-ok" id="overall-pulse"></div><span id="overall-text">Checking systems...</span></div>
    <div class="hero-title">System Status</div>
    <div class="hero-sub">Live status of all Conch & Cmdr services</div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-bottom:.75rem">
    <button class="btn-refresh" id="refresh-btn" onclick="runAllChecks()"><span>↻</span> Refresh</button>
  </div>

  <div class="section-title">Core Services</div>
  <div id="services-list"></div>

  <div class="uptime-bar">
    <div class="uptime-title">90-day uptime (simulated)</div>
    <div class="uptime-dots" id="uptime-dots"></div>
    <div class="uptime-legend"><span>90 days ago</span><span>Today</span></div>
  </div>

  <div class="last-check" id="last-check">Last checked: —</div>
</div>

<footer>Conch & Cmdr — Status Page · Auto-refreshes every 60s</footer>

<script>
const SERVICES=[
  {id:'download',icon:'📥',name:'Download Page',desc:'index.html — main download hub',url:'index.html',type:'page'},
  {id:'announcements',icon:'📣',name:'Announcements',desc:'announcements.html — news & updates',url:'announcements.html',type:'page'},
  {id:'supabase',icon:'🗄️',name:'Supabase Database',desc:'REST API — announcements, settings, blacklist',url:null,type:'supabase'},
  {id:'github',icon:'🐙',name:'GitHub Releases API',desc:'github.com — file release source',url:`https://api.github.com/repos/${GITHUB_REPO}/releases?per_page=1`,type:'external'},
  {id:'fonts',icon:'🔤',name:'Google Fonts CDN',desc:'fonts.googleapis.com — typography',url:'https://fonts.googleapis.com/css2?family=Syne:wght@400',type:'external'},
];

let _results={};

function renderServices(){
  const list=document.getElementById('services-list');
  list.innerHTML=SERVICES.map(s=>{
    const r=_results[s.id]||{status:'checking'};
    const stCls={ok:'st-ok',warn:'st-warn',err:'st-err',checking:'st-chk'}[r.status]||'st-chk';
    const stTxt={ok:'Operational',warn:'Degraded',err:'Down',checking:'Checking...'}[r.status]||'Checking...';
    const dotCls={ok:'pulse-ok',warn:'pulse-warn',err:'pulse-err',checking:''}[r.status]||'';
    return `<div class="service-card">
      <div class="svc-icon">${s.icon}</div>
      <div class="svc-info"><div class="svc-name">${s.name}</div><div class="svc-desc">${s.desc}</div></div>
      <div class="svc-right">
        ${r.ms?`<span class="svc-ping">${r.ms}ms</span>`:''}
        <div class="svc-status ${stCls}">${dotCls?`<div class="pulse ${dotCls}"></div>`:''} ${stTxt}</div>
      </div>
    </div>`;
  }).join('');
}

function updateOverall(){
  const badge=document.getElementById('overall-badge'),txt=document.getElementById('overall-text');
  const vals=Object.values(_results);
  if(!vals.length)return;
  const allOk=vals.every(v=>v.status==='ok');
  const anyErr=vals.some(v=>v.status==='err');
  badge.className='overall-badge '+(allOk?'ob-ok':anyErr?'ob-err':'ob-warn');
  txt.textContent=allOk?'All Systems Operational':anyErr?'Partial Outage Detected':'Degraded Performance';
}

async function checkService(s){
  _results[s.id]={status:'checking'};renderServices();
  const t0=Date.now();
  try{
    if(s.type==='supabase'){
      const r=await fetch(`${SUPA_URL}/rest/v1/site_settings?key=eq.banner_enabled&select=value`,{headers:{'apikey':SUPA_ANON,'Authorization':'Bearer '+SUPA_ANON}});
      const ms=Date.now()-t0;
      _results[s.id]={status:r.ok?'ok':'err',ms};
    } else if(s.type==='page'){
      const r=await fetch(s.url,{method:'HEAD',cache:'no-store'});
      const ms=Date.now()-t0;
      _results[s.id]={status:r.ok?'ok':'warn',ms};
    } else {
      const r=await fetch(s.url,{method:'GET',cache:'no-store',mode:'no-cors'});
      const ms=Date.now()-t0;
      _results[s.id]={status:'ok',ms};
    }
  }catch(e){_results[s.id]={status:'err',ms:Date.now()-t0};}
  renderServices();updateOverall();
}

function renderUptimeDots(){
  const dots=document.getElementById('uptime-dots');
  // Simulate 90 days — mostly ok with occasional warn
  dots.innerHTML=Array.from({length:90},(_,i)=>{
    const r=Math.random();
    const cls=r>.97?'ud ud-err':r>.93?'ud ud-warn':'ud ud-ok';
    return `<div class="${cls}" title="Day ${90-i}"></div>`;
  }).join('');
}

async function runAllChecks(){
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('spin');btn.disabled=true;
  await Promise.all(SERVICES.map(s=>checkService(s)));
  document.getElementById('last-check').textContent='Last checked: '+new Date().toLocaleTimeString();
  btn.classList.remove('spin');btn.disabled=false;
}

renderUptimeDots();
runAllChecks();
setInterval(runAllChecks,60000);
</script>
</body>
</html>
