<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Conch & Cmdr</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --conch:#0ff4c6;--cmdr:#ff4f5e;
    --bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;
    --border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;
    --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;position:relative}

  /* ANIMATED GRID BG */
  .grid-bg{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:60px 60px;animation:gridShift 20s linear infinite;pointer-events:none}
  @keyframes gridShift{0%{background-position:0 0}100%{background-position:60px 60px}}

  /* GLOW */
  .glow-c{position:fixed;top:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(15,244,198,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowPulse 4s ease-in-out infinite}
  .glow-r{position:fixed;bottom:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(255,79,94,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowPulse 4s ease-in-out infinite 2s}
  @keyframes glowPulse{0%,100%{opacity:0.6}50%{opacity:1}}

  /* MAIN CONTENT */
  .container{position:relative;z-index:1;text-align:center;padding:2rem;max-width:600px}

  /* BIG 404 */
  .four-o-four{font-size:clamp(6rem,20vw,12rem);font-weight:800;line-height:1;letter-spacing:-0.05em;position:relative;display:inline-block;margin-bottom:1rem}
  .four-o-four .n4-l{color:var(--conch);display:inline-block;animation:float 3s ease-in-out infinite}
  .four-o-four .n0{color:var(--muted);display:inline-block;opacity:0.3;animation:float 3s ease-in-out infinite 0.3s;position:relative}
  .four-o-four .n4-r{color:var(--cmdr);display:inline-block;animation:float 3s ease-in-out infinite 0.6s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* GLITCH on the 0 */
  .n0::before,.n0::after{content:'0';position:absolute;left:0;top:0;width:100%;opacity:0.4}
  .n0::before{color:var(--conch);animation:glitch1 3s infinite 1s;clip-path:polygon(0 0,100% 0,100% 45%,0 45%)}
  .n0::after{color:var(--cmdr);animation:glitch2 3s infinite 1s;clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%)}
  @keyframes glitch1{0%,90%,100%{transform:translate(0)}92%{transform:translate(-4px,2px)}96%{transform:translate(4px,-2px)}}
  @keyframes glitch2{0%,90%,100%{transform:translate(0)}94%{transform:translate(4px,2px)}98%{transform:translate(-4px,-2px)}}

  /* BADGE */
  .err-badge{display:inline-block;font-family:var(--mono);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;padding:0.3rem 0.8rem;border-radius:4px;background:rgba(255,79,94,0.1);color:var(--cmdr);border:1px solid rgba(255,79,94,0.2);margin-bottom:1.5rem}

  /* TEXT */
  .err-title{font-size:clamp(1.4rem,4vw,2rem);font-weight:800;letter-spacing:-0.02em;margin-bottom:0.75rem}
  .err-desc{font-family:var(--mono);font-size:0.85rem;color:var(--muted);line-height:1.8;max-width:420px;margin:0 auto 2.5rem}

  /* TERMINAL BLOCK */
  .terminal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin:0 auto 2.5rem;max-width:420px;text-align:left}
  .term-header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)}
  .term-dot{width:10px;height:10px;border-radius:50%}
  .term-dot.red{background:#ff5f57}.term-dot.yellow{background:#febc2e}.term-dot.green{background:#28c840}
  .term-body{font-family:var(--mono);font-size:0.78rem;color:var(--muted);line-height:1.9}
  .term-prompt{color:var(--conch)}
  .term-cmd{color:var(--text)}
  .term-err{color:var(--cmdr)}
  .term-cursor{display:inline-block;width:8px;height:14px;background:var(--conch);animation:blink 1s step-end infinite;vertical-align:text-bottom}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* BUTTONS */
  .btn-group{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:0.8rem;letter-spacing:0.04em;padding:0.6rem 1.4rem;border-radius:6px;text-decoration:none;transition:all 0.2s;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:0.4em;position:relative;overflow:hidden}
  .btn-primary{background:rgba(15,244,198,0.12);color:var(--conch);border:1px solid rgba(15,244,198,0.25)}
  .btn-primary:hover{background:rgba(15,244,198,0.22)}
  .btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:rgba(255,255,255,0.18);color:var(--text)}
  .ripple-btn{position:absolute;border-radius:50%;transform:scale(0);animation:rip 0.5s linear;pointer-events:none;background:rgba(15,244,198,0.3)}
  @keyframes rip{to{transform:scale(4);opacity:0}}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;background:rgba(11,12,15,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:64px}
  .nav-logo{font-size:1.1rem;font-weight:800;letter-spacing:-0.02em;display:flex;gap:0.4em;align-items:center;text-decoration:none}
  .nav-logo .c{color:var(--conch)}.nav-logo .sep{color:var(--muted)}.nav-logo .r{color:var(--cmdr)}
  nav a.nav-back{color:var(--muted);text-decoration:none;font-size:0.8rem;font-family:var(--mono);letter-spacing:0.04em;transition:color 0.2s}
  nav a.nav-back:hover{color:var(--conch)}

  /* PARTICLES */
  canvas#particles{position:fixed;inset:0;z-index:0;pointer-events:none}

  @media(max-width:480px){nav{padding:1rem 1.2rem}.four-o-four{font-size:5rem}}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-c"></div>
<div class="glow-r"></div>
<canvas id="particles"></canvas>

<nav>
  <a class="nav-logo" href="index.html"><span class="c">Conch</span><span class="sep">/</span><span class="r">Cmdr</span></a>
  <a class="nav-back" href="index.html">← Back to Downloads</a>
</nav>

<div class="container">
  <div class="four-o-four">
    <span class="n4-l">4</span><span class="n0">0</span><span class="n4-r">4</span>
  </div>

  <div class="err-badge">Page not found</div>

  <h1 class="err-title">Lost in the void.</h1>
  <p class="err-desc">The page you're looking for doesn't exist, was removed, or took a wrong turn somewhere in the release pipeline.</p>

  <div class="terminal">
    <div class="term-header">
      <div class="term-dot red"></div>
      <div class="term-dot yellow"></div>
      <div class="term-dot green"></div>
    </div>
    <div class="term-body">
      <div><span class="term-prompt">› </span><span class="term-cmd">GET</span> <span style="color:var(--muted)">/<span id="path-display">unknown</span></span></div>
      <div><span class="term-err">Error 404</span> — resource not found</div>
      <div><span class="term-prompt">› </span><span class="term-cmd">cd</span> <span style="color:var(--muted)">/downloads</span></div>
      <div><span class="term-prompt">› </span><span class="term-cursor"></span></div>
    </div>
  </div>

  <div class="btn-group">
    <a class="btn btn-primary" href="index.html" onclick="ripple(event)">↓ Go to Downloads</a>
    <a class="btn btn-ghost" href="announcements.html" onclick="ripple(event)">📣 Announcements</a>
    <button class="btn btn-ghost" onclick="history.back()">← Go Back</button>
  </div>
</div>

<script>
/* Show current path in terminal */
document.getElementById('path-display').textContent=location.pathname.replace('/','').slice(0,30)||'unknown';

/* RIPPLE */
function ripple(e){
  const btn=e.currentTarget,r=document.createElement('span');r.className='ripple-btn';
  const rect=btn.getBoundingClientRect(),size=Math.max(rect.width,rect.height);
  r.style.cssText=`width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  btn.style.position='relative';btn.style.overflow='hidden';
  btn.appendChild(r);setTimeout(()=>r.remove(),500);
}

/* FLOATING PARTICLES */
const cv=document.getElementById('particles'),ctx=cv.getContext('2d');
cv.width=window.innerWidth;cv.height=window.innerHeight;
window.addEventListener('resize',()=>{cv.width=window.innerWidth;cv.height=window.innerHeight});
const cols=['rgba(15,244,198,','rgba(255,79,94,'];
const parts=Array.from({length:40},()=>({
  x:Math.random()*cv.width,y:Math.random()*cv.height,
  r:1+Math.random()*2,col:cols[Math.floor(Math.random()*cols.length)],
  vx:(Math.random()-.5)*0.4,vy:(Math.random()-.5)*0.4,
  alpha:0.1+Math.random()*0.4
}));
function drawParticles(){
  ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.col+p.alpha+')';ctx.fill();
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;
    if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();
</script>
</body>
</html>
