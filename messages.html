<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conch & Cmdr — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
(function(){
  const s=localStorage.getItem('cc_theme');
  if(s==='light')document.documentElement.classList.add('light-mode');
  const a=localStorage.getItem('cc_accent');
  if(a&&a!=='#0ff4c6')document.documentElement.style.setProperty('--conch',a);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --conch:#0ff4c6;--cmdr:#ff4f5e;--purple:#a78bfa;--gold:#ffc832;
  --bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;--surface3:#20242e;
  --border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
:root.light-mode{--bg:#f5f7fa;--surface:#fff;--surface2:#f0f2f5;--surface3:#e8ebf0;--border:rgba(0,0,0,0.08);--text:#1a1d24;--muted:#6b7280}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;flex-direction:column}

/* NAV */
nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);height:56px;z-index:10}
.nav-logo{font-size:1rem;font-weight:800;text-decoration:none;display:flex;gap:.3em}
.nav-logo .c{color:var(--conch)}.nav-logo .r{color:var(--cmdr)}.nav-logo .s{color:var(--muted)}
.nav-title{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.nav-back{font-family:var(--mono);font-size:.72rem;padding:.35rem .8rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);text-decoration:none;cursor:pointer;transition:all .2s}
.nav-back:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* LAYOUT */
.layout{flex:1;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.sidebar-head{padding:.85rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--text)}
.add-friend-btn{font-family:var(--mono);font-size:.7rem;padding:.3rem .7rem;border-radius:6px;border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.08);color:var(--purple);cursor:pointer;transition:all .2s}
.add-friend-btn:hover{background:rgba(167,139,250,.16)}

.sidebar-tabs{display:flex;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:.65rem .5rem;font-family:var(--mono);font-size:.68rem;text-align:center;cursor:pointer;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;transition:all .2s;position:relative}
.tab-btn.active{color:var(--conch);border-bottom-color:var(--conch)}
.tab-badge{position:absolute;top:.3rem;right:.3rem;min-width:14px;height:14px;border-radius:7px;background:var(--purple);color:#fff;font-size:.55rem;display:flex;align-items:center;justify-content:center;padding:0 3px}

.sidebar-search{padding:.6rem .85rem;border-bottom:1px solid var(--border)}
.sidebar-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.72rem;padding:.4rem .7rem;outline:none}
.sidebar-search input:focus{border-color:rgba(167,139,250,.35)}
.sidebar-search input::placeholder{color:var(--muted);opacity:.5}

.sidebar-list{flex:1;overflow-y:auto;padding:.4rem}
.friend-row{display:flex;align-items:center;gap:.65rem;padding:.6rem .7rem;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:.1rem}
.friend-row:hover{background:var(--surface2)}
.friend-row.active{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.15)}
.friend-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--conch);flex-shrink:0;overflow:hidden;font-family:var(--sans);border:1px solid var(--border)}
.friend-avatar img{width:100%;height:100%;object-fit:cover}
.friend-info{flex:1;min-width:0}
.friend-name{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.friend-preview{font-family:var(--mono);font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--conch);flex-shrink:0}

.req-row{display:flex;align-items:center;gap:.65rem;padding:.6rem .7rem;border-radius:8px;margin-bottom:.1rem;background:var(--surface2);border:1px solid var(--border)}
.req-btns{display:flex;gap:.3rem;flex-shrink:0}
.req-btn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.req-accept{background:rgba(15,244,198,.12);color:var(--conch)}.req-accept:hover{background:rgba(15,244,198,.22)}
.req-decline{background:rgba(255,79,94,.1);color:var(--cmdr)}.req-decline:hover{background:rgba(255,79,94,.2)}

.list-empty{text-align:center;padding:2.5rem 1rem;font-family:var(--mono);font-size:.75rem;color:var(--muted);opacity:.6;line-height:1.8}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;opacity:.4}
.chat-empty-icon{font-size:3rem}
.chat-empty-text{font-family:var(--mono);font-size:.82rem;color:var(--muted)}

.chat-header{flex-shrink:0;padding:.85rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;background:var(--surface)}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:var(--conch);overflow:hidden;flex-shrink:0;font-family:var(--sans)}
.chat-header-avatar img{width:100%;height:100%;object-fit:cover}
.chat-header-name{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--text)}
.chat-header-status{font-family:var(--mono);font-size:.65rem;color:var(--muted)}

/* MESSAGES */
.chat-thread{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.2rem;display:flex;flex-direction:column;gap:.75rem}
.chat-thread::-webkit-scrollbar{width:4px}
.chat-thread::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.msg-row{display:flex;flex-direction:column}
.msg-row.own{align-items:flex-end}
.msg-row.other{align-items:flex-start}
.msg-sender{font-family:var(--mono);font-size:.65rem;color:var(--purple);font-weight:600;margin-bottom:.25rem;padding-left:2px}
.msg-bubble{padding:.65rem 1rem;border-radius:18px;font-family:var(--mono);font-size:.82rem;line-height:1.6;max-width:65%;width:fit-content}
.msg-bubble.own{background:rgba(167,139,250,.18);border-bottom-right-radius:4px}
.msg-bubble.other{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:.25rem;padding:0 2px}

/* INPUT */
.chat-input-area{flex-shrink:0;padding:.85rem 1.2rem;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:.75rem;align-items:flex-end}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--mono);font-size:.82rem;padding:.7rem 1rem;outline:none;resize:none;line-height:1.5;max-height:120px;min-height:42px}
.chat-input:focus{border-color:rgba(167,139,250,.4)}
.chat-input::placeholder{color:var(--muted);opacity:.5}
.send-btn{width:42px;height:42px;border-radius:12px;background:rgba(167,139,250,.15);color:var(--purple);border:none;cursor:pointer;font-size:1.1rem;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center}
.send-btn:hover{background:rgba(167,139,250,.28)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* ACCESS WALL */
.access-wall{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.75rem;text-align:center;padding:2rem}
.access-icon{font-size:3rem}
.access-title{font-size:1.4rem;font-weight:800;color:var(--cmdr)}
.access-desc{font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:1.8}
.access-btn{font-family:var(--mono);font-size:.78rem;padding:.6rem 1.3rem;border-radius:8px;background:rgba(15,244,198,.1);color:var(--conch);border:1px solid rgba(15,244,198,.25);text-decoration:none;transition:all .2s}

/* ADD FRIEND PANEL */
.add-friend-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:1rem}
.add-friend-panel.open{display:flex}
.add-friend-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:380px;padding:1.4rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.add-friend-title{font-family:var(--mono);font-size:.85rem;font-weight:700;margin-bottom:1rem}
.add-friend-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.8rem;padding:.65rem .9rem;outline:none;margin-bottom:.75rem}
.add-friend-input:focus{border-color:rgba(167,139,250,.35)}
.add-friend-results{display:flex;flex-direction:column;gap:.4rem;max-height:220px;overflow-y:auto;margin-bottom:.75rem}
.add-friend-result{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s}
.add-friend-result:hover{border-color:rgba(167,139,250,.3)}
.add-friend-close{width:100%;font-family:var(--mono);font-size:.78rem;padding:.55rem;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;transition:all .2s}
.add-friend-close:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* TOAST */
#toast-c{position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.65rem 1rem;font-family:var(--mono);font-size:.74rem;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tIn .25s ease;position:relative;overflow:hidden;min-width:200px}
.toast.out{opacity:0;transform:translateX(8px);transition:all .25s}
@keyframes tIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.tbar{position:absolute;bottom:0;left:0;height:2px;animation:tb linear forwards}
@keyframes tb{from{width:100%}to{width:0%}}

@media(max-width:640px){
  .sidebar{width:200px}
  .msg-bubble{max-width:80%}
}
</style>
</head>
<body>
<div id="toast-c"></div>

<nav>
  <a class="nav-logo" href="index.html"><span class="c">Conch</span><span class="s">/</span><span class="r">Cmdr</span></a>
  <span class="nav-title">💬 Messages</span>
  <a class="nav-back" href="index.html">← Back</a>
</nav>

<!-- ADD FRIEND PANEL -->
<div class="add-friend-panel" id="add-friend-panel" onclick="if(event.target===this)closeAddFriend()">
  <div class="add-friend-box">
    <div class="add-friend-title">➕ Add Friend</div>
    <input class="add-friend-input" id="af-input" type="text" placeholder="Search by username..." oninput="searchFriend(this.value)">
    <div class="add-friend-results" id="af-results"></div>
    <button class="add-friend-close" onclick="closeAddFriend()">Close</button>
  </div>
</div>

<div id="main-layout" style="display:none;flex:1;overflow:hidden;flex-direction:row" class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">Friends</div>
      <button class="add-friend-btn" onclick="openAddFriend()">➕ Add</button>
    </div>
    <div class="sidebar-tabs">
      <button class="tab-btn active" id="tab-friends" onclick="switchTab('friends')">Chats</button>
      <button class="tab-btn" id="tab-requests" onclick="switchTab('requests')">
        Requests <span class="tab-badge" id="req-badge" style="display:none">0</span>
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" placeholder="🔍 Search..." oninput="filterList(this.value)">
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="list-empty">Loading...</div>
    </div>
  </div>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <div class="chat-empty" id="chat-empty">
      <div class="chat-empty-icon">💬</div>
      <div class="chat-empty-text">Select a friend to start chatting</div>
    </div>
    <div id="chat-active" style="display:none;flex:1;flex-direction:column;overflow:hidden" class="layout">
      <div class="chat-header">
        <div class="chat-header-avatar" id="chat-hdr-avatar"></div>
        <div>
          <div class="chat-header-name" id="chat-hdr-name"></div>
        </div>
      </div>
      <div class="chat-thread" id="chat-thread"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chat-input" placeholder="Type a message... (Enter to send)" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- ACCESS WALL -->
<div class="access-wall" id="access-wall" style="display:none">
  <div class="access-icon">🔒</div>
  <div class="access-title">Login Required</div>
  <div class="access-desc">You need to be logged in to use Messages.</div>
  <a class="access-btn" href="index.html">← Go to Login</a>
</div>

<script>
const SB='https://rmdkoauibmzhgnvrwhfd.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZGtvYXVpYm16aGdudnJ3aGZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjg2MDksImV4cCI6MjA5Mzg0NDYwOX0.lu6T00f9y9-Q8HhVag-MGjJz6bTlJrYUwC7AApIxaFw';

let ME=null;
let friends=[];
let requests=[];
let activeFriend=null;
let pollInterval=null;
let currentTab='friends';
let allFriends=[];

function sb(path,opts={}){
  const m=(opts.method||'GET').toUpperCase();
  const h={'apikey':KEY,'Authorization':'Bearer '+KEY};
  if(m!=='GET'&&m!=='HEAD')h['Content-Type']='application/json';
  return fetch(SB+path,{headers:{...h,...(opts.headers||{})},method:m,...(opts.body?{body:opts.body}:{})});
}

function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg,type='ok',dur=3000){
  const c=document.getElementById('toast-c'),el=document.createElement('div');
  el.className='toast';
  const col={ok:'#34d399',err:'#ff4f5e',info:'#a78bfa'}[type]||'#a78bfa';
  el.innerHTML=`<span style="color:${col}">${{ok:'✓',err:'✕',info:'•'}[type]}</span><span style="flex:1">${msg}</span><div class="tbar" style="background:${col};animation-duration:${dur}ms"></div>`;
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),280)},dur);
}

function timeAgo(s){
  const d=(Date.now()-new Date(s))/1000;
  if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h';
  return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function avatarHTML(username,avatarUrl,size=36){
  const letter=(username||'?')[0].toUpperCase();
  if(avatarUrl)return`<img src="${eh(avatarUrl)}" alt="">`;
  return eh(letter);
}

/* ── AUTH ── */
function init(){
  try{
    const s=localStorage.getItem('cc_auth');
    if(!s){showAccessWall();return;}
    const p=JSON.parse(s);
    if(!p||!p.username){showAccessWall();return;}
    ME=p;
    document.getElementById('main-layout').style.display='flex';
    loadFriends();
    loadRequests();
    setInterval(pollBadges,15000);
  }catch{showAccessWall();}
}

function showAccessWall(){
  document.getElementById('access-wall').style.display='flex';
}

/* ── TABS ── */
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-friends').classList.toggle('active',tab==='friends');
  document.getElementById('tab-requests').classList.toggle('active',tab==='requests');
  if(tab==='friends')renderFriends(allFriends);
  else renderRequests(requests);
}

function filterList(q){
  if(currentTab==='friends'){
    renderFriends(q?allFriends.filter(f=>(f.username||'').toLowerCase().includes(q.toLowerCase())):allFriends);
  }
}

/* ── FRIENDS ── */
async function loadFriends(){
  try{
    const r=await sb(`/rest/v1/cc_friends?or=(user_a_id.eq.${ME.id},user_b_id.eq.${ME.id})&select=*`);
    const rows=r.ok?await r.json():[];
    allFriends=rows.map(f=>{
      const isA=f.user_a_id===ME.id;
      return{id:isA?f.user_b_id:f.user_a_id,username:isA?f.user_b_username:f.user_a_username,avatar_url:isA?f.user_b_avatar:f.user_a_avatar,friendshipId:f.id};
    });
    if(currentTab==='friends')renderFriends(allFriends);
  }catch{
    if(currentTab==='friends')document.getElementById('sidebar-list').innerHTML='<div class="list-empty">Failed to load friends.</div>';
  }
}

function renderFriends(list){
  const el=document.getElementById('sidebar-list');
  if(!list.length){el.innerHTML='<div class="list-empty">No friends yet.<br>Click ➕ Add to get started!</div>';return;}
  el.innerHTML=list.map((f,i)=>`
    <div class="friend-row${activeFriend&&activeFriend.id===f.id?' active':''}" onclick="openChat(${i})">
      <div class="friend-avatar">${avatarHTML(f.username,f.avatar_url)}</div>
      <div class="friend-info">
        <div class="friend-name">${eh(f.username)}</div>
        <div class="friend-preview">Click to chat</div>
      </div>
    </div>`).join('');
  window._friendsList=list;
}

/* ── REQUESTS ── */
async function loadRequests(){
  try{
    const r=await sb(`/rest/v1/cc_friend_requests?to_user_id=eq.${ME.id}&status=eq.pending&select=*&order=created_at.desc`);
    requests=r.ok?await r.json():[];
    const badge=document.getElementById('req-badge');
    if(requests.length){badge.style.display='flex';badge.textContent=requests.length;}
    else{badge.style.display='none';}
    if(currentTab==='requests')renderRequests(requests);
  }catch{}
}

function renderRequests(list){
  const el=document.getElementById('sidebar-list');
  if(!list.length){el.innerHTML='<div class="list-empty">No pending requests.</div>';return;}
  el.innerHTML=list.map(r=>`
    <div class="req-row">
      <div class="friend-avatar">${avatarHTML(r.from_username,r.from_avatar)}</div>
      <div class="friend-info"><div class="friend-name">${eh(r.from_username)}</div></div>
      <div class="req-btns">
        <button class="req-btn req-accept" onclick="acceptReq('${eh(r.id)}','${eh(r.from_user_id)}','${eh(r.from_username)}','${eh(r.from_avatar||'')}')" title="Accept">✓</button>
        <button class="req-btn req-decline" onclick="declineReq('${eh(r.id)}')" title="Decline">✕</button>
      </div>
    </div>`).join('');
}

async function acceptReq(reqId,fromId,fromUsername,fromAvatar){
  try{
    await sb('/rest/v1/cc_friends',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({user_a_id:ME.id,user_a_username:ME.username,user_a_avatar:ME.avatar_url||null,user_b_id:fromId,user_b_username:fromUsername,user_b_avatar:fromAvatar||null,created_at:new Date().toISOString()})});
    await sb(`/rest/v1/cc_friend_requests?id=eq.${reqId}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({status:'accepted'})});
    toast('Friend added: '+fromUsername,'ok');
    await loadFriends();await loadRequests();
  }catch{toast('Failed','err');}
}

async function declineReq(reqId){
  try{
    await sb(`/rest/v1/cc_friend_requests?id=eq.${reqId}`,{method:'DELETE'});
    toast('Request declined','info');
    await loadRequests();
  }catch{}
}

/* ── CHAT ── */
function openChat(idx){
  const f=(window._friendsList||[])[idx];
  if(!f)return;
  activeFriend=f;
  renderFriends(window._friendsList);

  document.getElementById('chat-empty').style.display='none';
  document.getElementById('chat-active').style.display='flex';

  const hdrAv=document.getElementById('chat-hdr-avatar');
  hdrAv.innerHTML=avatarHTML(f.username,f.avatar_url);
  document.getElementById('chat-hdr-name').textContent=f.username;

  loadMessages();
  if(pollInterval)clearInterval(pollInterval);
  pollInterval=setInterval(loadMessages,4000);
}

async function loadMessages(){
  if(!activeFriend)return;
  try{
    const r=await sb(`/rest/v1/cc_messages?or=(and(from_user_id.eq.${ME.id},to_user_id.eq.${activeFriend.id}),and(from_user_id.eq.${activeFriend.id},to_user_id.eq.${ME.id}))&select=*&order=created_at.asc&limit=100`);
    const msgs=r.ok?await r.json():[];
    renderMessages(msgs);
    /* Mark as read */
    const unread=msgs.filter(m=>m.to_user_id===ME.id&&!m.read);
    if(unread.length){
      await Promise.all(unread.map(m=>sb(`/rest/v1/cc_messages?id=eq.${m.id}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({read:true})})));
    }
  }catch{}
}

function renderMessages(msgs){
  const thread=document.getElementById('chat-thread');
  const atBottom=thread.scrollHeight-thread.scrollTop-thread.clientHeight<80;
  if(!msgs.length){thread.innerHTML='<div class="list-empty">No messages yet. Say hi! 👋</div>';return;}
  thread.innerHTML=msgs.map(m=>{
    const isOwn=m.from_user_id===ME.id;
    return`<div class="msg-row ${isOwn?'own':'other'}">
      ${!isOwn?`<div class="msg-sender">${eh(m.from_username)}</div>`:''}
      <div class="msg-bubble ${isOwn?'own':'other'}">${eh(m.text)}</div>
      <div class="msg-time">${timeAgo(m.created_at)}</div>
    </div>`;
  }).join('');
  if(atBottom)thread.scrollTop=thread.scrollHeight;
}

async function sendMsg(){
  if(!activeFriend)return;
  const input=document.getElementById('chat-input');
  const text=input.value.trim();
  if(!text||text.length>500)return;
  input.value='';input.style.height='auto';
  try{
    await sb('/rest/v1/cc_messages',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({from_user_id:ME.id,from_username:ME.username,to_user_id:activeFriend.id,to_username:activeFriend.username,text,read:false,created_at:new Date().toISOString()})});
    await loadMessages();
  }catch{toast('Failed to send','err');}
}

/* ── ADD FRIEND ── */
function openAddFriend(){document.getElementById('add-friend-panel').classList.add('open');document.getElementById('af-input').value='';document.getElementById('af-results').innerHTML='';}
function closeAddFriend(){document.getElementById('add-friend-panel').classList.remove('open');}

let afDebounce=null;
function searchFriend(q){
  clearTimeout(afDebounce);
  if(!q||q.length<2){document.getElementById('af-results').innerHTML='';return;}
  afDebounce=setTimeout(async()=>{
    try{
      const r=await sb(`/rest/v1/cc_users?username=ilike.*${encodeURIComponent(q)}*&select=id,username,display_name,avatar_url&limit=8`);
      const rows=r.ok?await r.json():[];
      const filtered=rows.filter(u=>u.id!==ME.id);
      const res=document.getElementById('af-results');
      if(!filtered.length){res.innerHTML='<div class="list-empty">No users found.</div>';return;}
      res.innerHTML=filtered.map(u=>`
        <div class="add-friend-result" onclick="sendReq('${eh(u.id)}','${eh(u.display_name||u.username)}','${eh(u.avatar_url||'')}',this)">
          <div class="friend-avatar" style="width:28px;height:28px;font-size:.7rem">${avatarHTML(u.display_name||u.username,u.avatar_url,28)}</div>
          <span style="font-family:var(--mono);font-size:.78rem;flex:1">${eh(u.display_name||u.username)}</span>
          <span style="font-family:var(--mono);font-size:.65rem;color:var(--purple)">+ Add</span>
        </div>`).join('');
    }catch{}
  },300);
}

async function sendReq(toId,toUsername,toAvatar,el){
  const already=allFriends.find(f=>f.id===toId);
  if(already){toast('Already friends!','info');return;}
  try{
    await sb('/rest/v1/cc_friend_requests',{method:'POST',headers:{'Prefer':'return=minimal'},
      body:JSON.stringify({from_user_id:ME.id,from_username:ME.username,from_avatar:ME.avatar_url||null,to_user_id:toId,to_username:toUsername,status:'pending',created_at:new Date().toISOString()})});
    el.style.opacity='.5';el.style.pointerEvents='none';
    el.querySelector('span:last-child').textContent='✓ Sent';
    toast('Friend request sent to '+toUsername,'ok');
  }catch{toast('Failed to send request','err');}
}

async function pollBadges(){
  if(!ME)return;
  try{
    const r=await sb(`/rest/v1/cc_friend_requests?to_user_id=eq.${ME.id}&status=eq.pending&select=id`);
    const rows=r.ok?await r.json():[];
    const badge=document.getElementById('req-badge');
    if(rows.length){badge.style.display='flex';badge.textContent=rows.length;}
    else{badge.style.display='none';}
  }catch{}
}

init();
</script>
