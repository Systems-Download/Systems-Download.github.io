<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Conch & Cmdr — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
(function(){
  const s=localStorage.getItem('cc_theme');
  if(s==='light')document.documentElement.classList.add('light-mode');
  const a=localStorage.getItem('cc_accent');
  if(a&&a!=='#0ff4c6')document.documentElement.style.setProperty('--conch',a);
})();
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --conch:#0ff4c6;--cmdr:#ff4f5e;--purple:#a78bfa;
  --bg:#0b0c0f;--surface:#13151a;--surface2:#1a1d24;
  --border:rgba(255,255,255,0.07);--text:#e8eaf0;--muted:#6b7280;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
}
:root.light-mode{--bg:#f5f7fa;--surface:#fff;--surface2:#f0f2f5;--border:rgba(0,0,0,0.08);--text:#1a1d24;--muted:#6b7280}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}

/* NAV */
.topnav{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;background:var(--surface);border-bottom:1px solid var(--border)}
.nav-logo{font-size:.9rem;font-weight:800;text-decoration:none;display:flex;gap:.3em}
.nav-logo .c{color:var(--conch)}.nav-logo .r{color:var(--cmdr)}.nav-logo .s{color:var(--muted)}
.nav-back{font-family:var(--mono);font-size:.7rem;padding:.3rem .7rem;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);text-decoration:none}

/* LAYOUT */
.app{display:flex;flex-direction:column;height:100vh}
.body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface)}
.sb-head{padding:.75rem .9rem;border-bottom:1px solid var(--border)}
.sb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.sb-title{font-family:var(--mono);font-size:.78rem;font-weight:700}
.sb-acts{display:flex;gap:.35rem}
.iab{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.iab:hover{color:var(--purple);border-color:rgba(167,139,250,.35)}
.sb-search{position:relative}
.sb-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.7rem;padding:.38rem .65rem .38rem 1.7rem;outline:none}
.sb-search input:focus{border-color:rgba(167,139,250,.3)}
.sb-search input::placeholder{color:var(--muted);opacity:.45}
.sb-search-ic{position:absolute;left:.5rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.65rem;pointer-events:none}
.sb-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:.55rem}
.sbtab{flex:1;padding:.5rem;font-family:var(--mono);font-size:.63rem;text-align:center;cursor:pointer;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;transition:all .2s;position:relative}
.sbtab.on{color:var(--conch);border-bottom-color:var(--conch)}
.sbtab-badge{position:absolute;top:.18rem;right:.25rem;min-width:13px;height:13px;border-radius:7px;background:var(--cmdr);color:#fff;font-size:.5rem;display:flex;align-items:center;justify-content:center;padding:0 3px}

.sb-list{flex:1;overflow-y:auto;padding:.3rem}
.sb-list::-webkit-scrollbar{width:3px}
.sb-list::-webkit-scrollbar-thumb{background:var(--border)}

/* CONVO ROW */
.crow{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:.06rem}
.crow:hover{background:var(--surface2)}
.crow.active{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.12)}
.cav{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:var(--conch);overflow:hidden;font-family:var(--sans);flex-shrink:0;position:relative}
.cav.grp{border-radius:9px}
.cav img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ol-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:#34d399;border:2px solid var(--surface);display:none}
.ol-dot.show{display:block}
.cinfo{flex:1;min-width:0}
.cname{font-family:var(--mono);font-size:.74rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpreview{font-family:var(--mono);font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.08rem}

/* REQ ROW */
.rrow{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:8px;background:var(--surface2);border:1px solid var(--border);margin-bottom:.3rem}
.rbtns{display:flex;gap:.25rem;flex-shrink:0}
.rbtn{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.72rem;transition:all .12s}
.rbtn.ok{background:rgba(15,244,198,.1);color:var(--conch)}.rbtn.ok:hover{background:rgba(15,244,198,.2)}
.rbtn.no{background:rgba(255,79,94,.08);color:var(--cmdr)}.rbtn.no:hover{background:rgba(255,79,94,.18)}

.empty{text-align:center;padding:2rem .75rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);opacity:.55;line-height:1.9}

/* CHAT AREA */
.chat{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.no-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.5rem;opacity:.3}
.no-chat-ic{font-size:2.8rem}
.no-chat-tx{font-family:var(--mono);font-size:.78rem;color:var(--muted)}

/* CHAT HEADER */
.chdr{flex-shrink:0;display:flex;align-items:center;gap:.65rem;padding:.7rem 1rem;border-bottom:1px solid var(--border);background:var(--surface)}
.chdr-back{display:none;background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1}
.chdr-info{flex:1;min-width:0}
.chdr-name{font-family:var(--mono);font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chdr-status{font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.chdr-status.online{color:#34d399}
.chdr-acts{display:flex;gap:.3rem;flex-shrink:0}

/* SEARCH BAR */
.csearch{flex-shrink:0;padding:.45rem .85rem;border-bottom:1px solid var(--border);background:var(--surface2);display:none;gap:.4rem;align-items:center}
.csearch.show{display:flex}
.csearch input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:.72rem;padding:.35rem .6rem;outline:none}
.csearch input:focus{border-color:rgba(167,139,250,.3)}
.snbtn{width:24px;height:24px;border-radius:5px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--muted);font-size:.62rem;display:flex;align-items:center;justify-content:center}
.snbtn:hover{color:var(--text)}

/* TYPING */
.typing{flex-shrink:0;min-height:20px;padding:.2rem 1rem;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.tdots span{animation:td 1.2s infinite;display:inline-block}
.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* THREAD */
.thread{flex:1;overflow-y:auto;overflow-x:hidden;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem}
.thread::-webkit-scrollbar{width:3px}
.thread::-webkit-scrollbar-thumb{background:var(--border)}

/* DATE SEP */
.datesep{text-align:center;font-family:var(--mono);font-size:.6rem;color:var(--muted);margin:.3rem 0;position:relative}
.datesep::before,.datesep::after{content:'';position:absolute;top:50%;height:1px;background:var(--border);width:26%}
.datesep::before{left:0}.datesep::after{right:0}

/* MSG */
.mrow{display:flex;flex-direction:column}
.mrow.own{align-items:flex-end}
.mrow.other{align-items:flex-start}
.msender{font-family:var(--mono);font-size:.62rem;color:var(--purple);font-weight:600;margin-bottom:.18rem;padding:0 2px}
.mbubble{padding:.55rem .85rem;border-radius:16px;font-family:var(--mono);font-size:.82rem;line-height:1.55;max-width:62%;width:fit-content;min-width:44px;cursor:context-menu}
.mbubble.own{background:rgba(167,139,250,.16);border-bottom-right-radius:4px}
.mbubble.other{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.mbubble.hl{outline:2px solid rgba(255,200,50,.5)!important}
.mfooter{display:flex;align-items:center;gap:.35rem;margin-top:.15rem;padding:0 2px}
.mrow.own .mfooter{justify-content:flex-end}
.mtime{font-family:var(--mono);font-size:.57rem;color:var(--muted)}
.mtick{font-size:.62rem;color:var(--conch)}
.mreacts{display:flex;gap:.18rem;flex-wrap:wrap;margin-top:.2rem}
.rpill{font-size:.72rem;padding:.12rem .38rem;border-radius:10px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:inline-flex;align-items:center;gap:.18rem;font-family:var(--mono);transition:border-color .12s}
.rpill:hover{border-color:rgba(167,139,250,.3)}
.rpill.mine{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.3)}
.rpill .rc{font-size:.6rem;color:var(--muted)}

/* INPUT */
.cinput-area{flex-shrink:0;padding:.6rem .85rem;border-top:1px solid var(--border);background:var(--surface)}
.cinput-row{display:flex;gap:.45rem;align-items:flex-end}
.cinput{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--mono);font-size:.8rem;padding:.58rem .85rem;outline:none;resize:none;min-height:40px;max-height:110px;line-height:1.5;transition:border-color .2s}
.cinput:focus{border-color:rgba(167,139,250,.35)}
.cinput::placeholder{color:var(--muted);opacity:.45}
.sendbtn{width:40px;height:40px;border-radius:10px;background:rgba(167,139,250,.14);color:var(--purple);border:none;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.sendbtn:hover{background:rgba(167,139,250,.25)}
.sendbtn:disabled{opacity:.3;cursor:not-allowed}

/* OVERLAY PANELS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.obox{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;padding:1.3rem;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:oIn .22s ease}
@keyframes oIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.otitle{font-family:var(--mono);font-size:.8rem;font-weight:700;margin-bottom:.9rem}
.oinput{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:.76rem;padding:.55rem .8rem;outline:none;margin-bottom:.55rem}
.oinput:focus{border-color:rgba(167,139,250,.3)}
.oinput::placeholder{color:var(--muted);opacity:.45}
.oresults{display:flex;flex-direction:column;gap:.3rem;max-height:190px;overflow-y:auto;margin-bottom:.55rem}
.oresult{display:flex;align-items:center;gap:.55rem;padding:.45rem .65rem;background:var(--surface2);border:1px solid var(--border);border-radius:7px;cursor:pointer;transition:border-color .12s}
.oresult:hover{border-color:rgba(167,139,250,.3)}
.obtn{width:100%;font-family:var(--mono);font-size:.74rem;padding:.5rem;border-radius:7px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;margin-top:.25rem;transition:all .2s}
.obtn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.obtn.prim{border-color:rgba(15,244,198,.3);color:var(--conch);background:rgba(15,244,198,.07)}
.obtn.prim:hover{background:rgba(15,244,198,.14)}
.obtn.dng{border-color:rgba(255,79,94,.3);color:var(--cmdr);background:rgba(255,79,94,.06)}
.obtn.dng:hover{background:rgba(255,79,94,.14)}

/* REACT PICKER */
.rpicker{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.35rem .45rem;display:flex;gap:.22rem;z-index:500;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.rpicker .re{font-size:1.05rem;cursor:pointer;padding:.18rem;border-radius:5px;transition:background .1s}
.rpicker .re:hover{background:var(--surface2)}

/* CTX MENU */
.ctx{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:.28rem;min-width:150px;z-index:400;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none}
.ctx.show{display:block}
.cxi{padding:.45rem .75rem;font-family:var(--mono);font-size:.72rem;cursor:pointer;border-radius:6px;color:var(--text);transition:background .1s}
.cxi:hover{background:var(--surface2)}
.cxi.dng{color:var(--cmdr)}

/* ACCESS */
.awall{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.65rem;text-align:center;padding:2rem}
.awall-ic{font-size:2.8rem}
.awall-title{font-size:1.3rem;font-weight:800;color:var(--cmdr)}
.awall-desc{font-family:var(--mono);font-size:.76rem;color:var(--muted);line-height:1.8}
.awall-btn{font-family:var(--mono);font-size:.76rem;padding:.55rem 1.2rem;border-radius:7px;background:rgba(15,244,198,.1);color:var(--conch);border:1px solid rgba(15,244,198,.22);text-decoration:none}

/* TOAST */
#tc{position:fixed;bottom:1.2rem;right:1.2rem;z-index:9999;display:flex;flex-direction:column;gap:.35rem;pointer-events:none}
.tst{display:flex;align-items:center;gap:.45rem;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:.55rem .85rem;font-family:var(--mono);font-size:.7rem;color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tIn .18s ease;position:relative;overflow:hidden;min-width:170px}
.tst.out{opacity:0;transform:translateX(6px);transition:all .2s}
@keyframes tIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.tbar{position:absolute;bottom:0;left:0;height:2px;animation:tb linear forwards}
@keyframes tb{from{width:100%}to{width:0}}

/* MOBILE */
@media(max-width:660px){
  .sidebar{position:fixed;left:0;top:52px;bottom:0;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.5);z-index:100;transition:transform .25s ease}
  .sidebar.mob-open{transform:translateX(0)}
  .chdr-back{display:flex}
}
@media(min-width:661px){.mob-btn{display:none!important}}
.mob-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:.2rem;display:flex;align-items:center}
</style>
</head>
<body>
<div id="tc"></div>
<div class="ctx" id="ctx">
  <div class="cxi" onclick="ctxReact()">😀 React</div>
  <div class="cxi" onclick="ctxCopy()">📋 Copy</div>
  <div class="cxi dng" id="ctx-del" onclick="ctxDelete()" style="display:none">🗑️ Delete</div>
</div>

<!-- ADD FRIEND -->
<div class="overlay" id="af-ov" onclick="if(event.target===this)closeOv('af-ov')">
  <div class="obox" style="max-width:360px">
    <div class="otitle">➕ Add Friend</div>
    <input class="oinput" id="af-q" type="text" placeholder="Search username..." oninput="afSearch(this.value)">
    <div class="oresults" id="af-res"></div>
    <button class="obtn" onclick="closeOv('af-ov')">Close</button>
  </div>
</div>

<!-- CREATE GROUP -->
<div class="overlay" id="grp-ov" onclick="if(event.target===this)closeOv('grp-ov')">
  <div class="obox" style="max-width:380px">
    <div class="otitle">👥 Create Group</div>
    <input class="oinput" id="grp-name" type="text" placeholder="Group name..." maxlength="40">
    <div style="font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-bottom:.4rem">Select friends:</div>
    <div class="oresults" id="grp-friends" style="max-height:160px"></div>
    <button class="obtn prim" onclick="createGroup()">Create Group</button>
    <button class="obtn" onclick="closeOv('grp-ov')">Cancel</button>
  </div>
</div>

<!-- REMOVE FRIEND -->
<div class="overlay" id="rm-ov" onclick="if(event.target===this)closeOv('rm-ov')">
  <div class="obox" style="max-width:320px;text-align:center">
    <div style="font-size:1.8rem;margin-bottom:.5rem">👤</div>
    <div class="otitle" style="text-align:center">Remove Friend?</div>
    <div style="font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:.9rem;line-height:1.7" id="rm-txt"></div>
    <button class="obtn dng" onclick="doRemove()">Remove</button>
    <button class="obtn" onclick="closeOv('rm-ov')">Cancel</button>
  </div>
</div>

<!-- BLOCK -->
<div class="overlay" id="blk-ov" onclick="if(event.target===this)closeOv('blk-ov')">
  <div class="obox" style="max-width:320px;text-align:center">
    <div style="font-size:1.8rem;margin-bottom:.5rem">🚫</div>
    <div class="otitle" style="text-align:center">Block User?</div>
    <div style="font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:.9rem;line-height:1.7" id="blk-txt"></div>
    <button class="obtn dng" onclick="doBlock()">Block</button>
    <button class="obtn" onclick="closeOv('blk-ov')">Cancel</button>
  </div>
</div>

<div class="app">
  <nav class="topnav">
    <a class="nav-logo" href="index.html"><span class="c">Conch</span><span class="s">/</span><span class="r">Cmdr</span></a>
    <span style="font-family:var(--mono);font-size:.75rem;color:var(--muted)">💬 Messages</span>
    <a class="nav-back" href="index.html">← Back</a>
  </nav>

  <div id="awall" class="awall" style="display:none">
    <div class="awall-ic">🔒</div>
    <div class="awall-title">Login Required</div>
    <div class="awall-desc">You need to be logged in to use Messages.</div>
    <a class="awall-btn" href="index.html">← Login</a>
  </div>

  <div class="body" id="body" style="display:none">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="sb-top">
          <div class="sb-title">💬 Messages</div>
          <div class="sb-acts">
            <button class="iab" title="New Group" onclick="openGrp()">👥</button>
            <button class="iab" title="Add Friend" onclick="openOv('af-ov');document.getElementById('af-q').value='';document.getElementById('af-res').innerHTML=''">➕</button>
          </div>
        </div>
        <div class="sb-search">
          <span class="sb-search-ic">🔍</span>
          <input type="text" placeholder="Search..." oninput="filterSidebar(this.value)">
        </div>
        <div class="sb-tabs">
          <button class="sbtab on" id="tab-chats" onclick="switchTab('chats')">Chats</button>
          <button class="sbtab" id="tab-reqs" onclick="switchTab('reqs')">Requests<span class="sbtab-badge" id="req-badge" style="display:none">0</span></button>
        </div>
      </div>
      <div class="sb-list" id="sb-list"><div class="empty">Loading...</div></div>
    </div>

    <!-- CHAT -->
    <div class="chat">
      <div class="no-chat" id="no-chat">
        <div class="no-chat-ic">💬</div>
        <div class="no-chat-tx">Select a conversation</div>
      </div>

      <div id="chat-ui" style="display:none;flex:1;flex-direction:column;overflow:hidden" class="chat">
        <div class="chdr">
          <button class="chdr-back mob-btn" onclick="closeChatMobile()">‹</button>
          <div class="cav" id="chdr-av" style="width:34px;height:34px;font-size:.78rem;flex-shrink:0"></div>
          <div class="chdr-info">
            <div class="chdr-name" id="chdr-name"></div>
            <div class="chdr-status" id="chdr-status"></div>
          </div>
          <div class="chdr-acts">
            <button class="iab" title="Search" onclick="toggleSearch()">🔍</button>
            <button class="iab" id="btn-remove" title="Remove Friend" onclick="openRemove()" style="display:none">👤</button>
            <button class="iab" id="btn-block" title="Block" onclick="openBlock()">🚫</button>
          </div>
        </div>

        <div class="csearch" id="csearch">
          <input type="text" id="csearch-q" class="csearch input" placeholder="Search messages..." oninput="doSearch(this.value)" style="flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:.72rem;padding:.35rem .6rem;outline:none">
          <button class="snbtn" onclick="navSearch(-1)">▲</button>
          <button class="snbtn" onclick="navSearch(1)">▼</button>
          <button class="snbtn" onclick="closeSearch()">✕</button>
        </div>

        <div class="thread" id="thread"></div>
        <div class="typing" id="typing-bar"></div>

        <div class="cinput-area">
          <div class="cinput-row">

function sb(path,o={}){

function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ago(s){const d=(Date.now()-new Date(s))/1000;if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function hhmm(s){return new Date(s).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function dateLabel(s){const d=new Date(s),n=new Date();const diff=Math.floor((n-d)/86400000);if(diff===0)return'Today';if(diff===1)return'Yesterday';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function av(username,url,size=36,isGrp=false){

}

/* ── FRIENDS ── */
async function loadFriends(){
  try{
    const r=await sb(`/rest/v1/cc_friends?or=(user_a_id.eq.${ME.id},user_b_id.eq.${ME.id})&select=*`);
    if(!r.ok)return;

    friends=rows.map(f=>{
      const isA=f.user_a_id===ME.id;
      return{id:isA?f.user_b_id:f.user_a_id,username:isA?f.user_b_username:f.user_a_username,avatar_url:isA?f.user_b_avatar:f.user_a_avatar,friendshipId:f.id,type:'dm'};
    });
    if(curTab==='chats')renderSidebar();
  }catch(e){console.error('loadFriends',e);}
}

/* ── GROUPS ── */
async function loadGroups(){
  try{
    const r=await sb(`/rest/v1/cc_groups?select=*`);
    if(!r.ok)return;
    const rows=await r.json();
    // Only show groups where ME is a member
    groups=rows.filter(g=>{
      try{const m=JSON.parse(g.members||'[]');return m.includes(ME.id);}catch{return false;}
    }).map(g=>({id:g.id,name:g.name,type:'grp',members:g.members,member_usernames:g.member_usernames}));

  }catch(e){console.error('loadGroups',e);}
}

/* ── SIDEBAR RENDER ── */
function renderSidebar(){

  _sbList=combined;

  if(!combined.length){
    el.innerHTML='<div class="empty">No conversations yet.<br>Add a friend to get started!</div>';

  }

    return`<div class="crow${isActive?' active':''}" onclick="openChat(${i})">
      ${isGrp
        ? `<div class="cav grp" style="width:36px;height:36px;font-size:.8rem;background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.3);color:var(--purple)">👥</div>`
        : `<div class="cav" style="width:36px;height:36px;font-size:.8rem;position:relative">
             ${c.avatar_url?`<img src="${eh(c.avatar_url)}" alt="">`:eh((name||'?')[0].toUpperCase())}

           </div>`
      }

        <div class="cname">${eh(name)}</div>
        <div class="cpreview">${isGrp?'Group chat':'Click to chat'}</div>

function filterSidebar(q){

    const r=await sb(`/rest/v1/cc_users?id=in.(${ids})&select=id,last_login`);
    if(!r.ok)return;
    const rows=await r.json();
    rows.forEach(u=>{
      const dot=document.getElementById('ol-'+u.id);
      if(dot){const on=u.last_login&&(Date.now()-new Date(u.last_login))<5*60*1000;dot.classList.toggle('show',on);}

/* ── LOAD MESSAGES ── */
async function loadMsgs(){
  if(!activeChat)return;
  try{
    let url='';
    if(activeChat.type==='dm'){
      url=`/rest/v1/cc_messages?or=(and(from_user_id.eq.${ME.id},to_user_id.eq.${activeChat.id}),and(from_user_id.eq.${activeChat.id},to_user_id.eq.${ME.id}))&select=*&order=created_at.asc&limit=200`;
    }else{
      url=`/rest/v1/cc_messages?group_id=eq.${activeChat.id}&select=*&order=created_at.asc&limit=200`;
    }
    const r=await sb(url);
    if(!r.ok)return;
    const rows=await r.json();
    msgs=rows;
    renderMsgs(rows);
    // Mark read
    const unread=rows.filter(m=>m.to_user_id===ME.id&&!m.read);
    if(unread.length)Promise.all(unread.map(m=>sb(`/rest/v1/cc_messages?id=eq.${m.id}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({read:true})})));
  }catch(e){console.error('loadMsgs',e);}
}

/* ── RENDER MESSAGES ── */
function renderMsgs(rows){
  const th=document.getElementById('thread');
  const atBot=th.scrollHeight-th.scrollTop-th.clientHeight<120;
  if(!rows.length){th.innerHTML='<div class="empty" style="margin-top:2rem">No messages yet. Say hi! 👋</div>';return;}

  let html='';let lastDate='';
  rows.forEach(m=>{
    const own=m.from_user_id===ME.id;
    const dl=dateLabel(m.created_at);
    if(dl!==lastDate){html+=`<div class="datesep">${dl}</div>`;lastDate=dl;}
    let reactions=[];
    try{reactions=JSON.parse(m.reactions||'[]');}catch{}
    const rHTML=reactions.length?`<div class="mreacts">${reactions.map(r=>`<div class="rpill${r.users&&r.users.includes(ME.id)?' mine':''}" onclick="toggleReact('${eh(m.id)}','${eh(r.emoji)}')">${r.emoji}<span class="rc">${r.count}</span></div>`).join('')}</div>`:'';

    html+=`<div class="mrow ${own?'own':'other'}" id="m-${m.id}">
      ${!own?`<div class="msender">${eh(m.from_username)}</div>`:''}
      <div class="mbubble ${own?'own':'other'}" oncontextmenu="onCtx(event,'${m.id}','${m.from_user_id}','${eh(m.text)}')">${eh(m.text)}</div>
      ${rHTML}
      <div class="mfooter">
        <span class="mtime">${hhmm(m.created_at)}</span>
        ${own?`<span class="mtick">${m.read?'✓✓':'✓'}</span>`:''}
      </div>
    </div>`;
  });
  th.innerHTML=html;
  if(atBot)th.scrollTop=th.scrollHeight;
}

/* ── SEND ── */
async function sendMsg(){
  if(!activeChat)return;
  const inp=document.getElementById('cinput');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='auto';
  clearTypingSignal();
  try{
    const payload={from_user_id:ME.id,from_username:ME.username,text,read:false,reactions:'[]',created_at:new Date().toISOString()};
    if(activeChat.type==='dm'){payload.to_user_id=activeChat.id;payload.to_username=activeChat.username;}
    else{payload.group_id=activeChat.id;}
    await sb('/rest/v1/cc_messages',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(payload)});
    await loadMsgs();
  }catch{toast('Failed to send','err');}
}

function onInput(el){

}
async function setTyping(on){
  if(!activeChat||activeChat.type!=='dm')return;
  try{
    if(on){await sb('/rest/v1/cc_typing',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:ME.id,to_user_id:activeChat.id,username:ME.username,updated_at:new Date().toISOString()})}).catch(()=>{});}
    else{await sb(`/rest/v1/cc_typing?user_id=eq.${ME.id}&to_user_id=eq.${activeChat.id}`,{method:'DELETE'}).catch(()=>{});}
  }catch{}
}
function clearTypingSignal(){clearTimeout(typingT);setTyping(false);}
async function checkTyping(){
  if(!activeChat||activeChat.type!=='dm')return;
  try{
    const r=await sb(`/rest/v1/cc_typing?user_id=eq.${activeChat.id}&to_user_id=eq.${ME.id}&select=username,updated_at`);
    if(!r.ok)return;
    const rows=await r.json();
    const bar=document.getElementById('typing-bar');
    if(rows.length&&(Date.now()-new Date(rows[0].updated_at))<4500){
      bar.innerHTML=`${eh(rows[0].username)} is typing <span class="tdots"><span>.</span><span>.</span><span>.</span></span>`;

function toggleSearch(){document.getElementById('csearch').classList.toggle('show');}

function doSearch(q){

/* ── CONTEXT MENU ── */
function onCtx(e,id,owner,txt){
  e.preventDefault();e.stopPropagation();
  ctxId=id;ctxOwner=owner;ctxTxt=txt;
  const m=document.getElementById('ctx');
  m.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-120)+'px';
  m.classList.add('show');
  document.getElementById('ctx-del').style.display=owner===ME.id?'block':'none';
}
document.addEventListener('click',()=>document.getElementById('ctx').classList.remove('show'));
function ctxCopy(){navigator.clipboard.writeText(ctxTxt).catch(()=>{});toast('Copied!','info');}
async function ctxDelete(){
  if(!ctxId)return;
  try{await sb(`/rest/v1/cc_messages?id=eq.${ctxId}&from_user_id=eq.${ME.id}`,{method:'DELETE'});await loadMsgs();}catch{toast('Failed','err');}
}
function ctxReact(){
  document.getElementById('ctx').classList.remove('show');
  const el=document.getElementById('m-'+ctxId);if(!el)return;
  const existing=document.getElementById('rpicker-tmp');if(existing)existing.remove();
  const p=document.createElement('div');p.className='rpicker';p.id='rpicker-tmp';
  const rect=el.getBoundingClientRect();
  p.style.left=Math.min(rect.left,window.innerWidth-200)+'px';
  p.style.top=(rect.top-46)+'px';
  p.innerHTML=EMOJIS.map(e=>`<div class="re" onclick="toggleReact('${ctxId}','${e}');document.getElementById('rpicker-tmp')?.remove()">${e}</div>`).join('');
  document.body.appendChild(p);
  setTimeout(()=>document.addEventListener('click',()=>document.getElementById('rpicker-tmp')?.remove(),{once:true}),0);
}

async function toggleReact(msgId,emoji){
  try{
    const r=await sb(`/rest/v1/cc_messages?id=eq.${msgId}&select=reactions`);
    if(!r.ok)return;
    const rows=await r.json();if(!rows.length)return;
    let reacts=[];try{reacts=JSON.parse(rows[0].reactions||'[]');}catch{}
    const ex=reacts.find(r=>r.emoji===emoji);
    if(ex){
      if(ex.users&&ex.users.includes(ME.id)){ex.users=ex.users.filter(u=>u!==ME.id);ex.count=ex.users.length;if(!ex.count)reacts=reacts.filter(r=>r.emoji!==emoji);}
      else{ex.users=[...(ex.users||[]),ME.id];ex.count=ex.users.length;}
    }else{reacts.push({emoji,count:1,users:[ME.id]});}
    await sb(`/rest/v1/cc_messages?id=eq.${msgId}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({reactions:JSON.stringify(reacts)})});
    await loadMsgs();
  }catch{}
}

function afSearch(q){
  clearTimeout(afT);
  const res=document.getElementById('af-res');
  if(!q||q.length<2){res.innerHTML='';return;}
  afT=setTimeout(async()=>{
    try{
      const r=await sb(`/rest/v1/cc_users?username=ilike.*${encodeURIComponent(q)}*&select=id,username,display_name,avatar_url&limit=8`);
      if(!r.ok)return;
      const rows=(await r.json()).filter(u=>u.id!==ME.id);
      window._afRows=rows;
      if(!rows.length){res.innerHTML='<div class="empty" style="padding:.6rem">No users found.</div>';return;}
      res.innerHTML=rows.map((u,i)=>`
        <div class="oresult" onclick="sendReq(${i},this)">
          <div class="cav" style="width:26px;height:26px;font-size:.62rem;flex-shrink:0">${u.avatar_url?`<img src="${eh(u.avatar_url)}" alt="">`:eh((u.display_name||u.username||'?')[0].toUpperCase())}</div>
          <span style="font-family:var(--mono);font-size:.74rem;flex:1">${eh(u.display_name||u.username)}</span>
          <span style="font-family:var(--mono);font-size:.62rem;color:var(--purple)">+ Add</span>
        </div>`).join('');
    }catch{}
  },280);
}
async function sendReq(i,el){
  const u=(window._afRows||[])[i];if(!u)return;
  if(friends.find(f=>f.id===u.id)){toast('Already friends!','info');return;}
  try{
    await sb('/rest/v1/cc_friend_requests',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({from_user_id:ME.id,from_username:ME.username,from_avatar:ME.avatar_url||null,to_user_id:u.id,to_username:u.display_name||u.username,status:'pending',created_at:new Date().toISOString()})});
    el.style.opacity='.45';el.style.pointerEvents='none';el.querySelector('span:last-child').textContent='✓ Sent';
    toast('Request sent!','ok');
  }catch{toast('Failed','err');}
}

/* ── GROUP ── */
function openGrp(){
  grpSelected=new Set();
  const list=document.getElementById('grp-friends');
  document.getElementById('grp-name').value='';
  if(!friends.length){list.innerHTML='<div class="empty" style="padding:.6rem">No friends yet.</div>';}
  else{
    list.innerHTML=friends.map((f,i)=>`
      <div class="oresult" id="gf-${f.id}" onclick="toggleGrpFriend('${f.id}',this)">
        <div class="cav" style="width:26px;height:26px;font-size:.62rem;flex-shrink:0">${f.avatar_url?`<img src="${eh(f.avatar_url)}" alt="">`:eh((f.username||'?')[0].toUpperCase())}</div>
        <span style="font-family:var(--mono);font-size:.74rem;flex:1">${eh(f.username)}</span>
        <span style="font-family:var(--mono);font-size:.68rem;color:var(--muted)" id="gfc-${f.id}">○</span>
      </div>`).join('');
  }
  openOv('grp-ov');
}
function toggleGrpFriend(id,el){
  if(grpSelected.has(id)){grpSelected.delete(id);el.style.borderColor='';document.getElementById('gfc-'+id).textContent='○';document.getElementById('gfc-'+id).style.color='var(--muted)';}
  else{grpSelected.add(id);el.style.borderColor='rgba(167,139,250,.4)';document.getElementById('gfc-'+id).textContent='●';document.getElementById('gfc-'+id).style.color='var(--purple)';}
}
async function createGroup(){
  const name=document.getElementById('grp-name').value.trim();
  if(!name){toast('Enter a group name','err');return;}
  if(!grpSelected.size){toast('Select at least 1 friend','err');return;}
  const memberIds=[ME.id,...Array.from(grpSelected)];
  const memberNames=[ME.username,...friends.filter(f=>grpSelected.has(f.id)).map(f=>f.username)];
  try{
    await sb('/rest/v1/cc_groups',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify({name,creator_id:ME.id,members:JSON.stringify(memberIds),member_usernames:JSON.stringify(memberNames),created_at:new Date().toISOString()})});
    toast('Group created: '+name,'ok');
    closeOv('grp-ov');
    await loadGroups();
  }catch(e){toast('Failed to create group: '+(e.message||''),'err');}
}

/* ── POLL ── */
async function poll(){
  await loadRequests();
  if(activeChat)checkOnline();
  if(activeChat&&activeChat.type==='dm')checkTyping();
}

init();
</script>
