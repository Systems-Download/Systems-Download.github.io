<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements — Conch & Cmdr</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --conch: #0ff4c6;
    --conch-dim: #0bb88e;
    --conch-dark: #003d2a;
    --cmdr: #ff4f5e;
    --cmdr-dim: #c8333f;
    --cmdr-dark: #3d0007;
    --bg: #0b0c0f;
    --surface: #13151a;
    --surface2: #1a1d24;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2.5rem;
    background: rgba(11,12,15,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    height: 64px;
  }
  .nav-logo {
    font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em;
    display: flex; gap: 0.4em; align-items: center;
    cursor: pointer; user-select: none;
  }
  .nav-logo span:first-child { color: var(--conch); }
  .nav-logo span:last-child  { color: var(--cmdr); }
  .nav-logo .sep { color: var(--muted); }

  .nav-right { display: flex; align-items: center; gap: 1.5rem; }
  nav a.nav-link {
    color: var(--muted); text-decoration: none; font-size: 0.8rem;
    font-family: var(--mono); letter-spacing: 0.04em; transition: color 0.2s;
  }
  nav a.nav-link:hover { color: var(--text); }
  nav a.nav-link.active { color: var(--conch); }

  /* ─── BURGER ─── */
  .burger {
    display: flex; flex-direction: column; justify-content: center;
    gap: 5px; width: 38px; height: 38px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px;
    transition: border-color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .burger:hover { border-color: rgba(255,255,255,0.18); background: var(--surface2); }
  .burger span {
    display: block; height: 1.5px; border-radius: 2px;
    background: var(--muted); transition: all 0.3s;
    transform-origin: center;
  }
  .burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); background: var(--conch); }
  .burger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); background: var(--conch); }

  /* ─── DRAWER ─── */
  .drawer-overlay {
    position: fixed; inset: 0; z-index: 98;
    background: rgba(0,0,0,0.5);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 99;
    width: 280px;
    background: #0e1014;
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column;
    padding: 0;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    height: 64px;
  }
  .drawer-logo {
    font-size: 1rem; font-weight: 800; letter-spacing: -0.02em;
    display: flex; gap: 0.3em;
  }
  .drawer-logo span:first-child { color: var(--conch); }
  .drawer-logo span:last-child  { color: var(--cmdr); }
  .drawer-logo .sep { color: var(--muted); }

  .drawer-close {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 1.1rem; padding: 0.3rem;
    transition: color 0.2s; line-height: 1;
  }
  .drawer-close:hover { color: var(--text); }

  .drawer-section-label {
    font-family: var(--mono); font-size: 0.62rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); padding: 1.2rem 1.5rem 0.5rem;
    opacity: 0.6;
  }

  .drawer-nav { flex: 1; overflow-y: auto; padding: 0.5rem 0.75rem; }

  .drawer-item {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 0.75rem; border-radius: 8px;
    cursor: pointer; transition: background 0.18s;
    text-decoration: none; color: var(--muted);
    font-family: var(--mono); font-size: 0.82rem;
    letter-spacing: 0.02em;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .drawer-item:hover { background: var(--surface); border-color: var(--border); color: var(--text); }
  .drawer-item.active { background: rgba(15,244,198,0.07); border-color: rgba(15,244,198,0.15); color: var(--conch); }

  .drawer-icon {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
  }

  .drawer-divider { height: 1px; background: var(--border); margin: 0.75rem 0.75rem; }

  .drawer-footer {
    padding: 1.2rem 1.5rem;
    border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    opacity: 0.5;
  }

  /* ─── ANNOUNCEMENT PAGE ─── */
  .ann-page-wrap {
    padding-top: 80px;
    min-height: 100vh;
  }

  .ann-hero {
    padding: 5rem 2.5rem 4rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .ann-hero::before {
    content: '';
    position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(15,244,198,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .ann-hero-label {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--conch);
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(15,244,198,0.08); border: 1px solid rgba(15,244,198,0.2);
    padding: 0.35rem 0.85rem; border-radius: 20px;
    margin-bottom: 1.2rem;
  }
  .ann-hero-label::before { 
    content: '●'; 
    font-size: 0.5rem; 
    animation: blink 1.5s ease-in-out infinite; 
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .ann-hero h1 {
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
    margin-bottom: 1rem;
  }
  .ann-hero h1 em { font-style: normal; color: var(--conch); }
  
  .ann-hero p {
    font-family: var(--mono); font-size: 0.88rem; color: var(--muted);
    max-width: 440px; margin: 0 auto; line-height: 1.8;
  }

  /* ─── ANN CARDS ─── */
  .ann-grid {
    max-width: 900px; margin: 0 auto;
    padding: 0 2.5rem 6rem;
    display: flex; flex-direction: column; gap: 1.2rem;
  }

  .ann-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
    animation: slideIn 0.35s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ann-card:hover { border-color: rgba(255,255,255,0.13); transform: translateY(-2px); }
  .ann-card.pinned { border-color: rgba(15,244,198,0.25); }

  .ann-card-head {
    display: flex; align-items: flex-start; gap: 1rem;
    padding: 1.4rem 1.4rem 0;
  }
  .ann-card-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    margin-top: 1px;
  }
  .ann-card-meta { flex: 1; }
  .ann-card-top {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    margin-bottom: 0.3rem;
  }

  .ann-tag {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 0.2rem 0.55rem; border-radius: 4px;
  }
  .tag-update     { background: rgba(15,244,198,0.1); color: var(--conch); border: 1px solid rgba(15,244,198,0.2); }
  .tag-patch      { background: rgba(255,79,94,0.1); color: var(--cmdr); border: 1px solid rgba(255,79,94,0.2); }
  .tag-notice     { background: rgba(255,200,50,0.1); color: #ffc832; border: 1px solid rgba(255,200,50,0.2); }
  .tag-feature    { background: rgba(120,80,255,0.1); color: #a880ff; border: 1px solid rgba(120,80,255,0.2); }
  .tag-breaking   { background: rgba(255,50,80,0.12); color: #ff5080; border: 1px solid rgba(255,50,80,0.25); }
  .tag-security   { background: rgba(255,150,0,0.1); color: #ff9600; border: 1px solid rgba(255,150,0,0.2); }
  .tag-deprecation{ background: rgba(150,150,150,0.1); color: #9ca3af; border: 1px solid rgba(150,150,150,0.2); }
  .tag-info       { background: rgba(60,140,255,0.1); color: #3c8cff; border: 1px solid rgba(60,140,255,0.2); }
  .tag-pinned     { background: rgba(15,244,198,0.06); color: var(--conch); border: 1px solid rgba(15,244,198,0.15); opacity: 0.8; }

  .ann-card-title {
    font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text);
  }
  .ann-card-date {
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    margin-left: auto; flex-shrink: 0; padding-top: 1px;
  }

  .ann-card-body {
    padding: 0.85rem 1.4rem 1.4rem 1.4rem;
  }
  .ann-card-body p {
    font-family: var(--mono); font-size: 0.82rem; color: var(--muted);
    line-height: 1.85; margin-left: 3.5rem;
  }
  .ann-card-body p strong { color: var(--text); font-weight: 600; }

  .ann-card-footer {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.9rem 1.4rem;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.01);
  }
  .ann-footer-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-conch { background: var(--conch); box-shadow: 0 0 6px rgba(15,244,198,0.4); }
  .dot-cmdr  { background: var(--cmdr); box-shadow: 0 0 6px rgba(255,79,94,0.4); }
  .dot-yellow{ background: #ffc832; box-shadow: 0 0 6px rgba(255,200,50,0.4); }
  .ann-footer-text { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); flex: 1; }
  .ann-footer-text strong { color: var(--text); }

  .ann-empty {
    text-align: center; padding: 4rem 2rem;
    font-family: var(--mono); font-size: 0.85rem; color: var(--muted); opacity: 0.5;
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center; padding: 3rem 2.5rem;
    font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
    border-top: 1px solid var(--border); margin-top: 0; opacity: 0.5;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    nav { padding: 1rem 1.2rem; }
    .ann-grid { padding: 0 1.2rem 4rem; }
    .ann-card-body p { margin-left: 0; }
    .drawer { width: 260px; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     ANNOUNCEMENTS CONFIG
═══════════════════════════════════════════════════════════════ -->
<script>
const ANNOUNCEMENTS = [
  {
    id: 1,
    pinned: true,
    icon: '👾',
    tag: 'info',
    title: 'Website launch!',
    date: '2026-05-07',
    body: 'The Website has officially launched! Grap the Latest Conch and Cmdr System!',
    footer: 'Website Release!',
    footerText: 'Check out the Downloads page for the latest versions',
  },
];
</script>
<!-- ═══════════════════════════════════════════════════════════ -->

<!-- NAV -->
<nav>
  <div class="nav-logo" onclick="window.location='index.html'">
    <span>Conch</span>
    <span class="sep">/</span>
    <span>Cmdr</span>
  </div>
  <div class="nav-right">
    <a class="nav-link" href="index.html">Downloads</a>
    <a class="nav-link active" href="announcements.html">Announcements</a>
    <button class="burger" id="burger-btn" onclick="toggleDrawer()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-logo">
      <span>Conch</span>
      <span class="sep">/</span>
      <span>Cmdr</span>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>

  <div class="drawer-nav">
    <p class="drawer-section-label">Navigation</p>
    <a class="drawer-item" href="index.html" onclick="closeDrawer()">
      <span class="drawer-icon">📥</span>
      Downloads
    </a>
    <a class="drawer-item active" href="announcements.html" onclick="closeDrawer()">
      <span class="drawer-icon">📣</span>
      Announcements
    </a>

    <div class="drawer-divider"></div>
    <p class="drawer-section-label">Quick Links</p>
    <a class="drawer-item" href="index.html#conch" onclick="closeDrawer()">
      <span class="drawer-icon" style="color:var(--conch)">◈</span>
      Conch Files
    </a>
    <a class="drawer-item" href="index.html#cmdr" onclick="closeDrawer()">
      <span class="drawer-icon" style="color:var(--cmdr)">◈</span>
      Cmdr Files
    </a>
  </div>

  <div class="drawer-footer">Announcements & Updates</div>
</div>

<!-- ANNOUNCEMENTS PAGE -->
<div class="ann-page-wrap">
  <div class="ann-hero">
    <div class="ann-hero-label">Live Updates</div>
    <h1>Announcements<br><em>&amp; Changelog</em></h1>
    <p>Latest news, updates and changes for Conch &amp; Cmdr.</p>
  </div>
  
  <div class="ann-grid" id="ann-grid"></div>
</div>

<footer>Conch &amp; Cmdr — Announcements</footer>

<script>
/* ─── DRAWER ─── */
let drawerOpen = false;
function toggleDrawer() { drawerOpen ? closeDrawer() : openDrawer(); }
function openDrawer() {
  drawerOpen = true;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('burger-btn').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  drawerOpen = false;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('burger-btn').classList.remove('open');
  document.body.style.overflow = '';
}

/* ─── RENDER ANNOUNCEMENTS ─── */
const TAG_CLASS = { 
  update: 'tag-update', 
  patch: 'tag-patch', 
  notice: 'tag-notice', 
  feature: 'tag-feature',
  breaking: 'tag-breaking',
  security: 'tag-security',
  deprecation: 'tag-deprecation',
  info: 'tag-info'
};
const TAG_LABEL = { 
  update: 'Update', 
  patch: 'Patch', 
  notice: 'Notice', 
  feature: 'Feature',
  breaking: 'Breaking',
  security: 'Security',
  deprecation: 'Deprecated',
  info: 'Info'
};

function renderAnnouncements() {
  const grid = document.getElementById('ann-grid');
  const items = ANNOUNCEMENTS || [];

  if (items.length === 0) {
    grid.innerHTML = `<div class="ann-empty">No announcements available.</div>`;
    return;
  }

  // Sort pinned first
  const sorted = [...items].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

  grid.innerHTML = '';
  sorted.forEach(ann => {
    const dotCls = ann.footer === 'conch' ? 'dot-conch' : 
                   ann.footer === 'cmdr' ? 'dot-cmdr' : 'dot-yellow';
    const tagCls = TAG_CLASS[ann.tag] || 'tag-notice';
    const tagLabel = TAG_LABEL[ann.tag] || ann.tag;
    
    const card = document.createElement('div');
    card.className = 'ann-card' + (ann.pinned ? ' pinned' : '');
    card.innerHTML = `
      <div class="ann-card-head">
        <div class="ann-card-icon">${ann.icon || '📣'}</div>
        <div class="ann-card-meta">
          <div class="ann-card-top">
            <span class="ann-tag ${tagCls}">${tagLabel}</span>
            ${ann.pinned ? '<span class="ann-tag tag-pinned">📌 Pinned</span>' : ''}
            <span class="ann-card-date">${ann.date || ''}</span>
          </div>
          <div class="ann-card-title">${ann.title}</div>
        </div>
      </div>
      <div class="ann-card-body"><p>${ann.body}</p></div>
      ${ann.footerText ? `
      <div class="ann-card-footer">
        <span class="ann-footer-dot ${dotCls}"></span>
        <span class="ann-footer-text">${ann.footerText}</span>
      </div>` : ''}
    `;
    grid.appendChild(card);
  });
}

/* ─── INIT ─── */
renderAnnouncements();
</script>
</body>
</html>
